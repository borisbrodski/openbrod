name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html favicon.svg og.png .nojekyll _site/
          # Fail if a file the page references is missing
          for f in $(grep -oE '(src|href|content)="/?[a-zA-Z0-9_-]+\.(svg|png)"' index.html \
                       | sed -E 's/.*="\/?([^"]+)"/\1/' | sort -u); do
            test -f "_site/$f" || { echo "Missing $f"; exit 1; }
          done
          ls -la _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
